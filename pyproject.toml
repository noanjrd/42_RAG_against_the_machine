[project]
name = "42-rag-against-the-machine"
version = "1.0.0"
description = "A command-line RAG system over the vLLM repository: BM25 search plus a local Qwen3 LLM."
readme = "README.md"
authors = [
    { name = "JARD Noan", email = "noan.pujol@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pydantic>=2.13.5",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
]

[project.scripts]
42-rag-against-the-machine = "src.__main__:main"

[tool.uv.build-backend]
module-name = "src"
module-root = ""


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
